[project]
name = "law-crawl"
version = "0.1.0"
description = "法律、法规、部门规章的目录与正文采集，由 GitHub Actions 定时运行"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.27",
    "python-docx>=1.1",
]

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.6"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
line-length = 140

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E501"]  # 测试里的页面样例、长断言不折行
