[project]
name = "law-crawl"
version = "0.1.0"
description = "Crawler for the catalogue and full text of Chinese laws, regulations and ministry rules, run on a schedule by GitHub Actions"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.27",
    "python-docx>=1.1",
]

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.6"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
line-length = 140

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E501"]  # sample pages and long assertions in tests are not wrapped
