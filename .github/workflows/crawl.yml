name: Crawl laws and rules

on:
  schedule:
    - cron: "30 12 * * *" # 20:30 Beijing time every day; done before midnight, so consumers get the day's data overnight
  workflow_dispatch:
    inputs:
      total_hours:
        description: Total running time of this crawl, in hours (5 at most)
        default: "4.5"
      content_limit:
        description: Maximum number of texts to fetch per chunk
        default: "100000"

permissions:
  contents: write # publish the Release, write back manifest.json

concurrency:
  group: crawl # one crawl at a time, so two runs never add up and trip a source's rate limiting
  cancel-in-progress: false

jobs:
  crawl:
    runs-on: ubuntu-latest
    timeout-minutes: 345
    env:
      GH_TOKEN: ${{ github.token }}
      TZ: Asia/Shanghai
      PYTHONUNBUFFERED: "1"
      CRAWL_CONTENT_LIMIT: ${{ inputs.content_limit || '100000' }}
      TOTAL_HOURS: ${{ inputs.total_hours || '4.5' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Download published data
        run: scripts/release-data.sh download

      - name: Probe data sources
        run: python -m law_crawl probe || echo "::warning::Some data sources are unreachable right now; see the output above"

      - name: Crawl (in chunks, publishing after each chunk)
        run: |
          hours="$TOTAL_HOURS"
          export CRAWL_TOTAL_SECONDS=$(python -c "print(int(min(float('$hours'), 5) * 3600))")
          scripts/crawl-loop.sh

      - name: Publish data
        if: always()
        run: scripts/release-data.sh upload

      - name: Write back the data manifest
        if: always()
        run: |
          python -m law_crawl manifest > manifest.json
          git config user.name "law-crawl-bot"
          git config user.email "law-crawl-bot@users.noreply.github.com"
          git add manifest.json
          git diff --cached --quiet && exit 0
          git commit -m "chore(data): update data manifest $(date +%F) [skip ci]"
          git pull --rebase --autostash
          git push

      - name: Run summary
        if: always()
        run: |
          {
            echo "### Data manifest"
            echo '```json'
            python -c "import json; m = json.load(open('manifest.json')); m.pop('recent_changes', None); print(json.dumps(m, ensure_ascii=False, indent=2))"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
